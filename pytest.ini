[pytest]
testpaths = tests
# Put the repo root on sys.path so `glassbox` imports without an install step.
# conftest.py's screener probe runs at import time, so this has to be config,
# not something a test arranges for itself.
pythonpath = . scripts
# `scripts` too, since 2026-09-02: the session runner is a script by
# invocation and a module by contract, and GB-R imports it directly rather
# than shelling out — a suite that can only drive a runner through argv can
# only assert on what it prints.
